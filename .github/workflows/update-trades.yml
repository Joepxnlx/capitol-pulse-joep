name: Update congressional trades

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capitol-pulse-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies installeren
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Openbare transacties ophalen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_TICKERS: ${{ vars.WATCH_TICKERS }}
          WATCH_POLITICIANS: ${{ vars.WATCH_POLITICIANS }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/update_trades.py

      - name: Gewijzigde dataset committen
        shell: bash
        run: |
          if git diff --quiet -- public/data/live.json; then
            echo "Geen wijziging in public/data/live.json."
            exit 0
          fi
          git config user.name "capitol-pulse-bot"
          git config user.email "capitol-pulse-bot@users.noreply.github.com"
          git add public/data/live.json
          git commit -m "Update congressional disclosures"
          git push
