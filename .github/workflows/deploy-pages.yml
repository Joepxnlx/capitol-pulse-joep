name: Deploy Capitol Pulse to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - manifest.webmanifest
      - service-worker.js
      - public/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Publicatiepakket bouwen
        shell: bash
        run: |
          mkdir -p site/public/data site/public/icons
          cp index.html app.js styles.css manifest.webmanifest service-worker.js site/
          cp service-worker.js site/sw.js
          cp public/data/*.json site/public/data/
          cp public/icons/*.png site/public/icons/

      - name: Pages-artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
